# AnyText2 精简环境配置
# 使用方法: conda env create -f environment.yaml

name: anytext2
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # ===== Python 基础 =====
  - python=3.10.19
  - cudatoolkit=11.8.0
  - pip

  # ===== Pip 核心依赖 =====
  - pip:
      # PyTorch 核心 (CUDA 11.8)
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.1.0+cu118
      - torchvision==0.16.0+cu118
      - xformers==0.0.22.post7+cu118

      # 深度学习框架
      - pytorch-lightning==1.5.0
      - transformers==4.38.2
      - diffusers==0.10.2
      - accelerate==0.24.1
      - peft==0.8.0
      - timm==1.0.22
      - safetensors==0.7.0

      # 文本处理
      - sentencepiece==0.2.1
      - sacremoses==0.1.1
      - subword-nmt==0.3.8
      - jieba==0.42.1
      - opencc==1.1.9

      # 图像处理
      - pillow==10.4.0
      - opencv-python-headless==4.9.0.80
      - albumentations==2.0.8
      - kornia==0.8.2
      - scikit-image==0.19.3

      # 配置管理
      - omegaconf==2.3.0
      - easydict==1.13
      - addict==2.4.0

      # Web 界面
      - gradio==4.44.1
      - fastapi==0.127.0

      # 数据处理
      - webdataset==1.0.2
      - datasets==2.8.0
      - pandas==2.3.3

      # 评估指标
      - open-clip-torch==3.2.0
      - torchmetrics==1.8.2

      # 工具库
      - einops==0.8.1
      - fsspec==2023.10.0
      - ujson==5.11.0
      - simplejson==3.20.2
      - sortedcontainers==2.4.0

      # 第三方服务
      - modelscope==1.4.0
      - tensorflow==2.13.1

      # 测试工具
      - test-tube==0.7.5
